<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Shahzaib Nasir — Full Stack Developer. Building fast, beautiful web applications with MERN, Python and Machine Learning." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shahzaib Nasir — Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer specializing in MERN stack, Python and Machine Learning." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/favicon/site.webmanifest" />

    <!-- Preconnect for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://portfolio-6ajg.onrender.com" />
    <link rel="dns-prefetch" href="https://portfolio-6ajg.onrender.com" />

    <!-- Fonts: Plus Jakarta Sans (headings) + Inter (body) + JetBrains Mono (code) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>Shahzaib Nasir — Portfolio</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --font-head: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-body: 'Inter', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      html { scroll-behavior: smooth; }

      body {
        font-family: var(--font-body);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent flash of unstyled content */
        background: #f8fafc;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; }
      }

      /* Nice scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #4f46e5, #0891b2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #6366f1, #0ea5e9); }

      ::selection { background: rgba(79,70,229,0.2); color: inherit; }

      /* Page loader */
      #root:empty::after {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, #4f46e5, #0891b2, #4f46e5);
        background-size: 200% 100%;
        animation: shimmer 1.4s ease infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
