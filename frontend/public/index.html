<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Full Stack Developer Portfolio — Building exceptional digital experiences" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Full Stack Developer — Building scalable, beautiful web experiences" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Portfolio</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg:           #09090b;
        --bg-2:         #111116;
        --surface:      rgba(255,255,255,0.04);
        --border:       rgba(255,255,255,0.07);
        --border-hover: rgba(255,255,255,0.14);
        --purple:       #8b5cf6;
        --purple-dark:  #6d28d9;
        --purple-glow:  rgba(139,92,246,0.35);
        --cyan:         #22d3ee;
        --cyan-glow:    rgba(34,211,238,0.25);
        --green:        #22c55e;
        --text-1:       #f1f5f9;
        --text-2:       #94a3b8;
        --text-3:       #475569;
        --font-head:    'Syne', sans-serif;
        --font-body:    'DM Sans', sans-serif;
        --font-mono:    'JetBrains Mono', monospace;
      }

      html { scroll-behavior: smooth; }

      body {
        background: var(--bg);
        color: var(--text-1);
        font-family: var(--font-body);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Grain texture overlay */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9997;
        pointer-events: none;
        opacity: 0.022;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #09090b; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #6d28d9, #22d3ee); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #8b5cf6, #22d3ee); }

      ::selection { background: rgba(139,92,246,0.3); color: #f1f5f9; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
